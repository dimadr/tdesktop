name: Telegramita 7.4.7 Windows x64 Release
'on':
  workflow_dispatch:
    inputs:
      qt_only:
        description: Prepare only the Windows x64 Qt cache
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: telegramita-windows-x64-release${{ inputs.qt_only && '-qt-only' || '' }}
  cancel-in-progress: false
jobs:
  base:
    if: github.repository == 'dimadr/tdesktop' && github.ref == 'refs/heads/telegramita/7.4.7-windows'
    runs-on: windows-2025-vs2026
    timeout-minutes: 300
    permissions:
      contents: write
    steps:
      - name: Use the physical D drive
        shell: pwsh
        run: |
          if (!(Test-Path 'D:\')) { throw 'Dedicated D: drive is unavailable' }
          New-Item -ItemType Directory -Path 'D:\TBuild' | Out-Null
          New-Item -ItemType Junction -Path "$env:GITHUB_WORKSPACE\TBuild" -Target 'D:\TBuild' | Out-Null
      - name: Check out pinned sources
        uses: actions/checkout@v6
        with:
          path: TBuild/tdesktop
          persist-credentials: false
      - name: Select Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: '3.10.11'
      - name: Prepare base on a fresh VM
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: '& D:\TBuild\tdesktop\ci\telegramita\windows.ps1 -Group base'
  media:
    if: inputs.qt_only == false
    needs: [base]
    runs-on: windows-2025-vs2026
    timeout-minutes: 300
    permissions:
      contents: write
    steps:
      - name: Use the physical D drive
        shell: pwsh
        run: |
          if (!(Test-Path 'D:\')) { throw 'Dedicated D: drive is unavailable' }
          New-Item -ItemType Directory -Path 'D:\TBuild' | Out-Null
          New-Item -ItemType Junction -Path "$env:GITHUB_WORKSPACE\TBuild" -Target 'D:\TBuild' | Out-Null
      - name: Check out pinned sources
        uses: actions/checkout@v6
        with:
          path: TBuild/tdesktop
          persist-credentials: false
      - name: Select Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: '3.10.11'
      - name: Prepare media on a fresh VM
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: '& D:\TBuild\tdesktop\ci\telegramita\windows.ps1 -Group media'
  rtc:
    needs: [base, media]
    runs-on: windows-2025-vs2026
    timeout-minutes: 300
    permissions:
      contents: write
    steps:
      - name: Use the physical D drive
        shell: pwsh
        run: |
          if (!(Test-Path 'D:\')) { throw 'Dedicated D: drive is unavailable' }
          New-Item -ItemType Directory -Path 'D:\TBuild' | Out-Null
          New-Item -ItemType Junction -Path "$env:GITHUB_WORKSPACE\TBuild" -Target 'D:\TBuild' | Out-Null
      - name: Check out pinned sources
        uses: actions/checkout@v6
        with:
          path: TBuild/tdesktop
          persist-credentials: false
      - name: Select Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: '3.10.11'
      - name: Prepare rtc on a fresh VM
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: '& D:\TBuild\tdesktop\ci\telegramita\windows.ps1 -Group rtc'
  qt:
    needs: [base]
    runs-on: windows-2025-vs2026
    timeout-minutes: 350
    permissions:
      contents: write
    steps:
      - name: Use the physical D drive
        shell: pwsh
        run: |
          if (!(Test-Path 'D:\')) { throw 'Dedicated D: drive is unavailable' }
          New-Item -ItemType Directory -Path 'D:\TBuild' | Out-Null
          New-Item -ItemType Junction -Path "$env:GITHUB_WORKSPACE\TBuild" -Target 'D:\TBuild' | Out-Null
      - name: Check out pinned sources
        uses: actions/checkout@v6
        with:
          path: TBuild/tdesktop
          persist-credentials: false
      - name: Select Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: '3.10.11'
      - name: Prepare qt on a fresh VM
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: '& D:\TBuild\tdesktop\ci\telegramita\windows.ps1 -Group qt'
  rust:
    if: inputs.qt_only == false
    needs: [base]
    runs-on: windows-2025-vs2026
    timeout-minutes: 300
    permissions:
      contents: write
    steps:
      - name: Use the physical D drive
        shell: pwsh
        run: |
          if (!(Test-Path 'D:\')) { throw 'Dedicated D: drive is unavailable' }
          New-Item -ItemType Directory -Path 'D:\TBuild' | Out-Null
          New-Item -ItemType Junction -Path "$env:GITHUB_WORKSPACE\TBuild" -Target 'D:\TBuild' | Out-Null
      - name: Check out pinned sources
        uses: actions/checkout@v6
        with:
          path: TBuild/tdesktop
          persist-credentials: false
      - name: Select Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: '3.10.11'
      - name: Prepare rust on a fresh VM
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: '& D:\TBuild\tdesktop\ci\telegramita\windows.ps1 -Group rust'
  app:
    needs: [base, media, rtc, qt, rust]
    runs-on: windows-2025-vs2026
    timeout-minutes: 330
    permissions:
      contents: write
    steps:
      - name: Use the physical D drive
        shell: pwsh
        run: |
          if (!(Test-Path 'D:\')) { throw 'Dedicated D: drive is unavailable' }
          New-Item -ItemType Directory -Path 'D:\TBuild' | Out-Null
          New-Item -ItemType Junction -Path "$env:GITHUB_WORKSPACE\TBuild" -Target 'D:\TBuild' | Out-Null
      - name: Check out pinned sources
        uses: actions/checkout@v6
        with:
          path: TBuild/tdesktop
          persist-credentials: false
          submodules: recursive
      - name: Select Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: '3.10.11'
      - name: Build and verify Windows x64 Release and Portable
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: '& D:\TBuild\tdesktop\ci\telegramita\windows.ps1 -Group app'
      - name: Return the verified portable and report
        uses: actions/upload-artifact@v7
        with:
          name: Telegramita-7.4.7-win64-portable
          path: D:/TBuild/deliver
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
